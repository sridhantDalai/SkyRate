name: SkyRate Daily Pipeline

# --- Schedule -----------------------------------------------------------------
# 12:00 AM IST = 00:00 Asia/Kolkata = 18:30 UTC (previous day)
# GitHub Actions cron uses UTC only.
on:
  schedule:
    - cron: "46 17 * * *"   # 17:50 UTC = 23:20 IST   # 18:30 UTC = 00:00 IST next day
  workflow_dispatch:

# --- Concurrency --------------------------------------------------------------
# Prevent two pipeline runs from executing simultaneously.
# cancel-in-progress: false ? a new scheduled event waits; it does NOT kill
# an already-running scraper (scraping cannot be aborted mid-flight safely).
concurrency:
  group: skyrate-pipeline
  cancel-in-progress: false

# --- Default permissions -------------------------------------------------------
permissions:
  contents: read

jobs:
  run-pipeline:
    name: "SkyRate Airfare Pipeline"
    runs-on: ubuntu-latest

    # Maximum wall-clock time: the full scrape + upload typically takes 20-30 min.
    # 6 hours gives generous headroom while still failing loudly if something hangs.
    timeout-minutes: 360

    # -- All Supabase credentials come from GitHub Actions Secrets -------------
    # Never hardcode secret values. Set these in:
    # Repository ? Settings ? Secrets and variables ? Actions ? New repository secret
    env:
      SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY:       ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_DB_URL:           ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_PUBLISHABLE_KEY:  ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

    steps:

      # -- 1. Checkout ----------------------------------------------------------
      - name: "Checkout repository"
        uses: actions/checkout@v4

      # -- 2. Python setup ------------------------------------------------------
      # Python 3.11 � compatible with all existing project dependencies.
      - name: "Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -- 3. Cache pip dependencies --------------------------------------------
      - name: "Cache pip packages"
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('prototype/ML/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # -- 4. Install Python dependencies ---------------------------------------
      - name: "Install Python dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r prototype/ML/requirements.txt

      # -- 5. Install Playwright Chromium + OS dependencies ---------------------
      # Playwright needs Chromium browser binaries AND system-level libs (fonts,
      # libpng, libglib, etc.) that are not shipped with the Python package.
      # --with-deps installs both in one command.
      - name: "Install Playwright Chromium browser"
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2t64
          playwright install chromium

      # -- 6. Validate secrets are present --------------------------------------
      # Fail early with a clear message rather than a cryptic Supabase error.
      - name: "Validate required secrets are configured"
        run: |
          missing=0
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::Secret SUPABASE_URL is not set. Add it in Repository ? Settings ? Secrets."
            missing=1
          fi
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::Secret SUPABASE_SECRET_KEY is not set."
            missing=1
          fi
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::Secret SUPABASE_DB_URL is not set. Automatic table creation will be disabled; tables must exist already."
          fi
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi
          echo "All required secrets are configured."

      # -- 7. Confirm pipeline entry point and data assets exist -----------------
      - name: "Confirm pipeline entry point"
        run: |
          echo "=== Pipeline entry point ==="
          echo "  Script : prototype/ML/ml/daily_pipeline.py"
          echo "  Mode   : --run-now"
          python -c "import sys; sys.exit(0 if __import__('pathlib').Path('prototype/ML/ml/daily_pipeline.py').exists() else 1)" \
            && echo "  Status : EXISTS" \
            || { echo "::error::daily_pipeline.py not found � check repository structure."; exit 1; }

          echo ""
          echo "=== Data asset check ==="
          # cpi_713.xlsx is needed by index_calculator.py � must be in repo
          python -c "
          from pathlib import Path
          import sys
          assets = [
              Path('prototype/ML/cpi_713.xlsx'),
              Path('prototype/ML/sources/cpi_713.xlsx'),
          ]
          found = [str(p) for p in assets if p.exists()]
          if not found:
              print('::error::cpi_713.xlsx not found in either prototype/ML/ or prototype/ML/sources/.')
              print('The .gitignore *.xlsx rule must have excluded it. Check .gitignore negation rules.')
              sys.exit(1)
          for f in found:
              print(f'  {f} : EXISTS')
          "

      # -- 8. Show run context ---------------------------------------------------
      - name: "Show run context"
        run: |
          echo "============================================================"
          echo "  SKYRATE DAILY PIPELINE - GITHUB ACTIONS"
          echo "============================================================"
          echo "  Date (UTC)    : $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "  Date (IST)    : $(TZ='Asia/Kolkata' date +'%Y-%m-%d %H:%M:%S IST')"
          echo "  Runner OS     : ${{ runner.os }}"
          echo "  Python        : $(python --version)"
          echo "  Trigger       : ${{ github.event_name }}"
          echo "  Commit        : ${{ github.sha }}"
          echo "  Ref           : ${{ github.ref }}"
          echo "============================================================"

      # -- 9. Run the SkyRate pipeline ------------------------------------------
      # Working directory is prototype/ML so that all relative paths
      # (sessions/, cpi_713.xlsx, sources/) resolve correctly � matching
      # how the pipeline is run locally on Windows.
      #
      # daily_pipeline.py --run-now performs, in order:
      #   1. Run main_scraper.py (Playwright/Chromium)
      #   2. Upload scraped data to Supabase
      #   3. Verify scraped table row count
      #   4. Run index_calculator.py (reads from Supabase)
      #   5. Upload index data to Supabase
      #   6. Verify index table row count
      #   7. ONLY on full success: delete tracked temp files
      #
      # A non-zero exit from any sub-step propagates as a non-zero exit here,
      # which causes GitHub Actions to mark the run as FAILED.
      - name: "Run SkyRate daily pipeline"
        working-directory: prototype/backend
        run: |
          echo "============================================================"
          echo "  SkyRate Daily Pipeline - Seed Mode"
          echo "  Date (IST): $(TZ=Asia/Kolkata date +%Y-%m-%d)"
          echo "============================================================"
          TODAY=$(TZ=Asia/Kolkata date +%d-%m-%y)
          echo "  Seeding DB for date: $TODAY"
          pip install psycopg2-binary python-dotenv supabase -q
          python run_pipeline.py "$TODAY"
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::Pipeline seed failed with code $EXIT_CODE"
            exit $EXIT_CODE
          fi
          echo "Pipeline complete at $(TZ=Asia/Kolkata date +%H:%M:%S) IST."
      # preserves them). This uploads them as a downloadable artifact.
      - name: "Upload pipeline logs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "skyrate-logs-${{ github.run_id }}"
          path: prototype/ML/ml/logs/
          if-no-files-found: ignore
          retention-days: 30


